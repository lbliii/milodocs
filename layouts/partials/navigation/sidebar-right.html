<!-- Right Sidebar: simple grid item that doesn't fight with layout -->
<aside id="sidebar-right" class="hidden xl:flex flex-col h-screen sticky top-0 py-4" data-component="navigation-sidebar-right" role="complementary" aria-label="On-page navigation">
  {{if .Site.Params.article.toc.display}}
    {{partial "article/toc.html" . }}
  {{end}}
  {{if .Site.Params.article.chat.display}}
   {{ if ne hugo.Environment "offline" }}
     {{ partial "article/chat.html" . }}
   {{ end }}
  {{end}}
</aside>
