# Hugo Global Settings 
## Site Details
baseURL: 'https://milodocs-theme.netlify.app/'
languageCode: 'en-us'
title: 'MiloDocs'
theme: milodocs

## Performance Optimizations
minify:
  minifyOutput: true
  
# Image processing for modern formats and optimization
imaging:
  resampleFilter: "lanczos"
  quality: 85
  hint: "photo"
  formats: ["webp", "jpg"]
  
# Build optimizations  
build:
  useResourceCacheWhen: "fallback"
  writeStats: true
  buildStats:
    enable: true
  cachebusters:
    - source: 'assets/notwatching/hugo_stats\.json'
      target: 'css'
    - source: '(postcss|tailwind)\.config\.js'
      target: 'css'

# Module configuration for TailwindCSS v4 Hugo integration
module:
  mounts:
    - source: 'assets'
      target: 'assets'
    - disableWatch: true
      source: 'hugo_stats.json'
      target: 'assets/notwatching/hugo_stats.json'

## Misc
enableGitInfo: true 
enableEmoji: true 
enableRobotsTXT: true 

